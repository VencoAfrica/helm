{{- if .Values.worker.short.scaledObject.enabled }}
{{- if .Values.worker.short.autoscaling.enabled }}
{{- fail "worker.short: cannot enable both autoscaling and scaledObject. Set worker.short.autoscaling.enabled=false when worker.short.scaledObject.enabled=true." }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "erpnext.fullname" . }}-worker-s
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "erpnext.fullname" . }}-worker-s
  minReplicaCount: {{ .Values.worker.short.scaledObject.minReplicaCount }}
  maxReplicaCount: {{ .Values.worker.short.scaledObject.maxReplicaCount }}
  pollingInterval: {{ .Values.worker.short.scaledObject.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.worker.short.scaledObject.cooldownPeriod | default 300 }}
  {{- with .Values.worker.short.scaledObject.advanced }}
  advanced:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.worker.short.scaledObject.fallback }}
  fallback:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  triggers:
    {{- toYaml .Values.worker.short.scaledObject.triggers | nindent 4 }}
{{- end }}
