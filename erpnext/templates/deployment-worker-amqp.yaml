{{- if .Values.worker.amqp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erpnext.fullname" . }}-worker-amqp
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
spec:
  {{- if and (not .Values.worker.amqp.autoscaling.enabled) (not .Values.worker.amqp.scaledObject.enabled) }}
  replicas: {{ .Values.worker.amqp.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "erpnext.name" . }}-worker-amqp
      app.kubernetes.io/instance: {{ .Release.Name }}-worker-amqp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "erpnext.name" . }}-worker-amqp
        app.kubernetes.io/instance: {{ .Release.Name }}-worker-amqp
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ template "erpnext.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
    {{- if .Values.worker.amqp.initContainers }}
      initContainers:
        {{- toYaml .Values.worker.amqp.initContainers | nindent 8 }}
    {{- end }}
      containers:
        - name: amqp
          {{- if .Values.worker.amqp.envVars }}
          env:
            {{- toYaml .Values.worker.amqp.envVars | nindent 12 }}
          {{- end }}
          args:
          - bench
          - start-amqp-consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          livenessProbe:
            {{- if .Values.worker.amqp.livenessProbe.override }}
            {{- toYaml .Values.worker.amqp.livenessProbe.probe | nindent 12 }}
            {{- else }}
            {{ tpl .Values.worker.healthProbe . | nindent 12 }}
            {{- end }}
          readinessProbe:
            {{- if .Values.worker.amqp.readinessProbe.override }}
            {{- toYaml .Values.worker.amqp.readinessProbe.probe | nindent 12 }}
            {{- else }}
            {{ tpl .Values.worker.healthProbe . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.amqp.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
          - name: sites-dir
            mountPath: /home/frappe/frappe-bench/sites
          - name: logs
            mountPath: /home/frappe/frappe-bench/logs
      {{- if .Values.worker.amqp.sidecars }}
        {{- toYaml .Values.worker.amqp.sidecars | nindent 8 }}
      {{- end }}
      volumes:
        - name: sites-dir
          {{- if .Values.persistence.worker.enabled }}
          persistentVolumeClaim:
            {{- if .Values.persistence.worker.existingClaim }}
            claimName: {{ .Values.persistence.worker.existingClaim }}
            {{- else }}
            claimName: {{ template "erpnext.fullname" . }}
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            {{- if .Values.persistence.logs.existingClaim }}
            claimName: {{ .Values.persistence.logs.existingClaim }}
            {{- else }}
            claimName: {{ template "erpnext.fullname" . }}-logs
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.worker.amqp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.worker.amqp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.worker.amqp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}